server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由回退到 index.html。不用 $uri/，否则 /assets 这类与静态目录同名的路由刷新会 301 到 /assets/ 再 403。
    location / {
        try_files $uri /index.html;
    }

    # 静态资源目录里缺文件时直接 404，不回退成 index.html，避免浏览器把 HTML 当脚本加载报错。
    location ~ ^/(assets|plugins|icons)/ {
        try_files $uri =404;
    }

    # 入口页每次校验，保证重新部署后能拿到新的资源文件名。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
